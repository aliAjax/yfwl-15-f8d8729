schema_version = "1.3"

[task]
name = "local/drift-linked-transit-recovery"
description = "Recover affine clock drift, sparse transits, target assignments, and repeat-supported periods from unlabeled multi-batch photometry."
authors = [{ name = "batch-d" }]
keywords = ["astronomy", "clock-calibration", "sparse-transits", "assignment", "repeat-logs"]

[agent]
timeout_sec = 3600
user = "worker"

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
workdir = "/app"

[verifier]
timeout_sec = 120
user = "worker"

[metadata]
difficulty = "expert"
category = "astronomy"
tags = ["photometry", "clock-drift", "sparse-events", "global-support", "catalog-history"]
expert_time_estimate = "45m"
